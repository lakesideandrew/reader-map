# Publishes web/ to GitHub Pages. Runs on every push to main, on demand,
# and is called by the weekly job after it commits new data (pushes made
# by a workflow do not trigger other workflows on their own).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the weekly job's fresh commit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
