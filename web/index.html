<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reader Map — Twin Cities ALPR status</title>
    <meta name="description" content="Which Twin Cities metro cities use Flock Safety and other automated license plate readers, which have cancelled, and where the cameras are." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='18' width='52' height='28' rx='6' fill='%231A1E26' stroke='%23FF7A30' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23FF7A30'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Resolve theme before paint: saved choice, then system preference.
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("readerMapTheme");
          if (s === "dark" || s === "light-paper") t = s;
          else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t = "light-paper";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button type="button" class="icon-btn mobile-only" id="menu-btn" aria-label="Show filters" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <a class="brand" href="#/map" aria-label="Reader Map home">
        <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="18" width="52" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="var(--accent)"/></svg>
        <span class="brand-text">Reader<span class="brand-accent">Map</span></span>
      </a>
      <span class="brand-sub">Twin Cities license plate reader tracker</span>
      <nav class="tabs" aria-label="Sections">
        <a class="tab" href="#/map" data-route="map">Map</a>
        <a class="tab" href="#/changes" data-route="changes">Changes <span class="tab-badge" id="changes-badge" hidden></span></a>
        <a class="tab" href="#/about" data-route="about">About</a>
      </nav>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle light or dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main>
      <!-- MAP -->
      <section class="page" id="page-map">
        <aside class="sidebar" id="sidebar" aria-label="Filters and city list">
          <div class="side-block">
            <div class="side-label">Status <span class="muted mono" id="city-total"></span></div>
            <div class="status-chips" id="status-chips"></div>
          </div>
          <div class="side-block">
            <input type="search" id="search" class="input" placeholder="Search cities…" autocomplete="off" />
            <div class="row">
              <select id="county" class="input" aria-label="County"><option value="">All counties</option></select>
            </div>
            <label class="toggle"><input type="checkbox" id="t-cameras" checked /> Camera locations (OpenStreetMap)</label>
            <label class="toggle"><input type="checkbox" id="t-inherit" checked /> Sheriff coverage for cities without a police department</label>
            <label class="toggle"><input type="checkbox" id="t-townships" checked /> Townships</label>
            <label class="toggle"><input type="checkbox" id="t-restricted" /> Only cities that restricted data sharing</label>
          </div>
          <div class="side-block list-block">
            <div class="side-label">Cities <span class="muted mono" id="list-count"></span></div>
            <ul class="city-list" id="city-list"></ul>
          </div>
          <div class="side-foot muted" id="side-foot"></div>
        </aside>

        <div class="map-wrap">
          <div id="map" role="application" aria-label="Map of city ALPR status"></div>
          <div class="legend" id="legend"></div>
          <aside class="detail" id="detail" hidden aria-live="polite"></aside>
        </div>
        <div class="backdrop" id="backdrop" hidden></div>
      </section>

      <!-- CHANGES -->
      <section class="page doc" id="page-changes" hidden>
        <div class="doc-inner">
          <h1>Changes</h1>
          <p class="lede">Every status change on the map, newest first. Changes come from news research, the weekly automated news check, and the weekly OpenStreetMap camera refresh.</p>
          <div id="proposals"></div>
          <div class="filter-row">
            <label class="toggle"><input type="checkbox" id="t-show-osm" /> Show camera count changes</label>
          </div>
          <div id="feed"></div>
        </div>
      </section>

      <!-- ABOUT -->
      <section class="page doc" id="page-about" hidden>
        <div class="doc-inner" id="about"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
